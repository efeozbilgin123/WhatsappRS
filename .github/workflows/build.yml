name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p whatsapprs-core

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Testler
        run: cargo test --workspace
      - name: Derleme (kurulum programı)
        working-directory: app
        run: cargo tauri build
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/WhatsappRS | Out-Null
          Copy-Item target/release/WhatsappRS.exe dist/WhatsappRS/
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Compress-Archive -Path dist/WhatsappRS -DestinationPath dist/WhatsappRS-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsappRS-windows
          path: |
            dist/*.exe
            dist/WhatsappRS-portable.zip
          if-no-files-found: error
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/WhatsappRS-portable.zip
