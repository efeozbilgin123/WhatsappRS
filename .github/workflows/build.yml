name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p whatsapprs-core
      - name: bridge.js testi
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node app/inject/test/bridge.test.js

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Testler
        run: cargo test --workspace
      - name: Derleme (kurulum programı)
        working-directory: app
        run: cargo tauri build
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/WhatsappRS | Out-Null
          Copy-Item target/release/WhatsappRS.exe dist/WhatsappRS/
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Compress-Archive -Path dist/WhatsappRS -DestinationPath dist/WhatsappRS-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsappRS-windows
          path: |
            dist/*.exe
            dist/WhatsappRS-portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WhatsappRS-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/WhatsappRS-portable.zip
