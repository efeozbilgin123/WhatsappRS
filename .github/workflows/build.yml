name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Sürümü yayınla (tauri.conf.json'daki sürümle v<sürüm> etiketi ve GitHub Release oluşturur)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p whatsapprs-core
      - name: bridge.js testi
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node app/inject/test/bridge.test.js

  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: pwsh
        run: echo "version=$((Get-Content app/tauri.conf.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Testler
        run: cargo test --workspace
      - name: Derleme (kurulum programı)
        working-directory: app
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { cargo tauri build }
          else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY yok: güncelleme dosyaları üretilmeyecek"
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM no-updater.json
            cargo tauri build -c no-updater.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Taşınabilir sürümü imzala
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: app
        run: cargo tauri signer sign ../target/release/WhatsappRS.exe
      - name: Dağıtım dosyaları
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/WhatsappRS | Out-Null
          Copy-Item target/release/WhatsappRS.exe dist/WhatsappRS/
          Compress-Archive -Path dist/WhatsappRS -DestinationPath dist/WhatsappRS-portable.zip -Force
          Copy-Item target/release/WhatsappRS.exe dist/WhatsappRS-portable.exe
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Copy-Item target/release/WhatsappRS.exe.sig dist/WhatsappRS-portable.exe.sig
            Copy-Item target/release/bundle/nsis/*-setup.exe.sig dist/
          }
          Remove-Item -Recurse dist/WhatsappRS
      - name: latest.json (otomatik güncelleme bildirimi)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $version = (Get-Content app/tauri.conf.json | ConvertFrom-Json).version
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $json = [ordered]@{
            version = $version
            notes = "WhatsappRS $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = @{ url = "$base/$($setup.Name)"; signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim() }
              "windows-x86_64-portable" = @{ url = "$base/WhatsappRS-portable.exe"; signature = (Get-Content dist/WhatsappRS-portable.exe.sig -Raw).Trim() }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          Get-Content dist/latest.json
      - name: Sürüm yayını denetimi
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Sürüm 0.2.9 yayımla'))
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Sürüm yayınlamak için TAURI_SIGNING_PRIVATE_KEY gizli anahtarı gerekli" }
          if (-not "${{ github.ref }}".StartsWith("refs/tags/")) { exit 0 }
          $version = (Get-Content app/tauri.conf.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Etiket ${{ github.ref_name }} ile tauri.conf.json sürümü ($version) farklı" }
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsappRS-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Sürüm 0.2.9 yayımla'))
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WhatsappRS-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: WhatsappRS ${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
