[package]
name = "whatsapprs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "WhatsApp Web için hafif masaüstü kabuğu"

[lib]
name = "whatsapprs"
path = "src/lib.rs"

[[bin]]
name = "WhatsappRS"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
whatsapprs-core = { path = "../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
log = "0.4"
flexi_logger = "0.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
