[package]
name = "whatsapprs"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-only"
description = "WhatsApp Web için hafif masaüstü kabuğu"

[lib]
name = "whatsapprs"
path = "src/lib.rs"

[[bin]]
name = "WhatsappRS"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
whatsapprs-core = { path = "../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
log = "0.4"
serde_json = "1"
flexi_logger = "0.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm"] }
tauri-winrt-notification = "0.8"
webview2-com = "0.39"
windows-registry = "0.6"
